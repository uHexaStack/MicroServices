      SPRING_KAFKA_BOOTSTRAPSERVERS: kafka:29092
      SPRING_DATASOURCE_URL: jdbc:mysql://ls-b1c4ebefc6ce8bde8e0e76ac1101df7264519db9.ck5q66s0o6ai.us-east-1.rds.amazonaws.com:3306/order?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: dbmasteruser
      SPRING_DATASOURCE_PASSWORD: mastardb
      JWT_SECRET: "aquaengine-jwt-secret-key-2024-very-secure-and-long-secret-key-for-production"
    networks:
      - aquaengine-network
    depends_on:
      kafka:
        condition: service_healthy
      registry-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      timeout: 30s
      retries: 5
      start_period: 60s
    mem_limit: 768m

  # Product Service (formerly Inventory Service)
  product-service:
