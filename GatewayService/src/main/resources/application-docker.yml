server:
  port: 8080
  
spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Registry Service (Eureka) - Ruta pública
        - id: registry-service
          uri: lb://registry-service
          predicates:
            - Path=/registry/**
          filters:
            - StripPrefix=1

        # Auth Service - Rutas de autenticación
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/authentication/**
          filters:
            - StripPrefix=0

        # Profile Service
        - id: profile-service
          uri: lb://profile-service
          predicates:
            - Path=/api/v1/profiles/**
          filters:
            - StripPrefix=0

        # Order Service
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - StripPrefix=0

        # Product Service (formerly Inventory Service)
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/**
          filters:
            - StripPrefix=0

        # Billing Service
        - id: billing-service
          uri: lb://billing-service
          predicates:
            - Path=/api/v1/billing/**
          filters:
            - StripPrefix=0

        # Payment Service
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - StripPrefix=0

        # Notification Service
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - StripPrefix=0

# Configuración JWT
jwt:
  secret: ${JWT_SECRET:aquaengine-jwt-secret-key-2024-very-secure-and-long-secret-key-for-production}

# Configuración de logging
logging:
  level:
    com.uhexastack.gatewayservice.filter: DEBUG
    org.springframework.cloud.gateway: DEBUG

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    hostname: gateway-service

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always 