spring.application.name=BillingService

# Spring DataSource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/billing-service-db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=dbmasteruser
spring.datasource.password=mastardb
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Data JPA Configuration
spring.jpa.show-sql=true
